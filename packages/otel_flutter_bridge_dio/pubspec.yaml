name: otel_flutter_bridge_dio
description: >-
  Dio interceptor for otel_flutter_bridge. Creates an OpenTelemetry client span
  per request and injects the W3C traceparent header.
version: 0.1.0-dev.3
repository: https://github.com/luizroddev/otel_flutter_bridge
issue_tracker: https://github.com/luizroddev/otel_flutter_bridge/issues
topics: [opentelemetry, observability, tracing, dio]
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  dartastic_opentelemetry: 0.11.0
  dio: ^5.4.0
  flutter:
    sdk: flutter
  otel_flutter_bridge: ^0.1.0-dev.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
